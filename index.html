<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2c6c">
<title>SG Bus 3D</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  :root {
    --blue: #0d2c6c;
    --red: #e01b24;
    --ink: #1b1b1f;
    --muted: #6b6b76;
    --card: rgba(255,255,255,0.97);
    --shadow: 0 6px 24px rgba(0,0,0,0.18);
    --green: #00c853;
    --amber: #ff9100;
    --lsd: #ff1744;
    --gold: #ffc400;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); overscroll-behavior: none; }
  #map { position: fixed; inset: 0; }
  button { font-family: inherit; }

  /* ---------- top bar ---------- */
  #topbar { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 8px; z-index: 5; }
  #searchForm { flex: 1; display: flex; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
  #q { flex: 1; border: 0; padding: 12px 14px; font-size: 17px; outline: none; background: transparent; min-width: 0; }
  #searchForm button { border: 0; background: var(--blue); color: #fff; font-weight: 700; font-size: 16px; padding: 0 14px; cursor: pointer; }
  #modeChip { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 0 12px; font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .iconbtn { border: 0; border-radius: 14px; box-shadow: var(--shadow); background: var(--card); color: var(--ink); width: 46px; min-height: 46px; font-size: 20px; cursor: pointer; flex: none; }
  .iconbtn.primary { background: var(--red); color: #fff; }

  /* ---------- route bar (browse) ---------- */
  #routeBar { position: fixed; top: calc(66px + env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 4; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; }
  .rtitle { display: flex; align-items: center; gap: 10px; }
  .svcbadge { background: var(--blue); color: #fff; font-weight: 800; border-radius: 8px; padding: 3px 9px; font-size: 17px; flex: none; }
  .svcbadge.red { background: var(--red); }
  #routeDir { font-size: 14px; line-height: 1.25; min-width: 0; }
  #routeDir small { color: var(--muted); display: block; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .pill { border: 1px solid #ddd; background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer; color: var(--ink); }
  .pill.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .pill.red { background: var(--red); color: #fff; border-color: var(--red); }
  #liveStatus { font-size: 13px; color: var(--muted); flex: 1; }

  /* ---------- bottom panel ---------- */
  #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,0.2); max-height: 60vh; overflow-y: auto; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); }
  #panel[hidden] { display: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #ccc; margin: 0 auto 8px; }
  .phead { display: flex; align-items: flex-start; gap: 10px; }
  .phead h2 { margin: 0; font-size: 19px; flex: 1; line-height: 1.25; }
  .sub { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
  .xbtn { border: 0; background: #eee; border-radius: 50%; width: 34px; height: 34px; font-size: 16px; cursor: pointer; flex: none; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 0; background: #0b7a75; color: #fff; font-weight: 700; border-radius: 8px; padding: 6px 10px; font-size: 15px; cursor: pointer; min-width: 48px; text-align: center; }
  .chip.current { background: var(--blue); outline: 3px solid var(--gold); }
  .arr { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .arr.tap { cursor: pointer; }
  .arr .info { flex: 1; min-width: 0; }
  .arr .dest { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .times { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  .t { border-radius: 7px; padding: 3px 7px; font-weight: 700; font-size: 13px; color: #fff; min-width: 42px; text-align: center; }
  .SEA { background: var(--green); } .SDA { background: var(--amber); } .LSD { background: var(--lsd); } .NA { background: #9e9e9e; }
  .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .note { font-size: 14px; color: var(--muted); padding: 6px 0; }
  .legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: var(--c); }
  .grp { margin-top: 10px; font-weight: 700; font-size: 14px; color: var(--blue); }
  .grp small { color: var(--muted); font-weight: 400; }
  .field { width: 100%; padding: 11px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 10px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 10px; color: var(--muted); }
  .stoplist { max-height: 34vh; overflow-y: auto; margin-top: 8px; border-top: 1px solid #eee; }
  .stopitem { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid #eee; cursor: pointer; }
  .seq { background: var(--blue); color: #fff; font-weight: 700; font-size: 12px; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex: none; }
  .stopitem .nm { flex: 1; font-size: 15px; }
  .stopitem .nm small { display: block; color: var(--muted); font-size: 12px; }
  .big { font-size: 22px; font-weight: 800; margin: 4px 0; line-height: 1.2; }
  .kpis { display: flex; gap: 8px; margin: 8px 0; }
  .kpi { flex: 1; background: #f1f4fa; border-radius: 12px; padding: 8px; text-align: center; }
  .kpi b { display: block; font-size: 20px; color: var(--blue); }
  .kpi span { font-size: 12px; color: var(--muted); }
  .dirbtn { display: block; width: 100%; text-align: left; margin-top: 8px; border: 2px solid var(--blue); background: #fff; border-radius: 12px; padding: 12px; font-size: 15px; cursor: pointer; }
  .dirbtn b { color: var(--blue); }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; }

  /* ---------- alert banner ---------- */
  #alertBox { position: fixed; left: 12px; right: 12px; top: calc(70px + env(safe-area-inset-top)); z-index: 30; background: var(--gold); color: #1b1b1f; border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: pop .25s ease-out; }
  #alertBox[hidden] { display: none; }
  #alertBox.red { background: var(--red); color: #fff; }
  #alertBox h2 { margin: 0 0 4px; font-size: 22px; }
  #alertBox p { margin: 0 0 10px; font-size: 15px; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- map markers ---------- */
  .pulse { width: 46px; height: 46px; border-radius: 50%; border: 4px solid #2962ff; animation: pulse 1.4s ease-out infinite; pointer-events: none; }
  @keyframes pulse { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .flag { background: var(--gold); color: #1b1b1f; font-weight: 800; font-size: 12px; padding: 4px 8px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.3); white-space: nowrap; pointer-events: none; }
  .flag.board { background: var(--green); color: #fff; }

  /* ---------- floating buttons ---------- */
  #fabs { position: fixed; right: 10px; z-index: 5; display: flex; flex-direction: column; gap: 8px; bottom: calc(24px + env(safe-area-inset-bottom)); transition: bottom .2s; }
  #followBtn { background: var(--blue); color: #fff; }

  /* ---------- modals ---------- */
  .modal { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal[hidden] { display: none; }
  .dlg { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 440px; box-shadow: var(--shadow); }
  .dlg h2 { margin: 0 0 6px; font-size: 18px; }
  .dlg p { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  .dlg .row { justify-content: flex-end; margin-top: 12px; }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; font-size: 15px; font-weight: 600; cursor: pointer; background: #eee; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.red { background: var(--red); color: #fff; }
  #testResult { font-size: 13px; margin-top: 8px; min-height: 18px; }

  #toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 50; background: #222; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
  #toast.show { opacity: .95; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 60; background: rgba(255,255,255,.85); font-size: 16px; padding: 20px; text-align: center; }
  .maplibregl-ctrl-bottom-left { bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <form id="searchForm" autocomplete="off">
    <input id="q" list="svcList" placeholder="Bus no. e.g. 105" aria-label="Bus service number">
    <button type="submit">Go</button>
  </form>
  <div id="modeChip" hidden></div>
  <datalist id="svcList"></datalist>
  <button id="onBusBtn" class="iconbtn primary" title="I'm on a bus" aria-label="I'm on a bus">🚌</button>
  <button id="restartBtn" class="iconbtn" title="Restart everything" aria-label="Restart">↺</button>
  <button id="settingsBtn" class="iconbtn" title="Settings" aria-label="Settings">⚙</button>
</div>

<div id="routeBar" hidden>
  <div class="rtitle"><span class="svcbadge" id="routeNo"></span><div id="routeDir"></div></div>
  <div class="row">
    <button class="pill" id="dirBtn">⇄ Other direction</button>
    <span id="liveStatus"></span>
    <button class="pill" id="clearBtn" aria-label="Clear route">✕</button>
  </div>
</div>

<div id="fabs">
  <button id="followBtn" class="iconbtn" hidden title="Follow bus">⌖</button>
  <button id="locateBtn" class="iconbtn" title="My location">◎</button>
</div>

<div id="panel" hidden></div>

<div id="alertBox" hidden>
  <h2 id="alertTitle"></h2>
  <p id="alertText"></p>
  <button class="btn" id="alertOk">OK</button>
</div>

<div id="settings" class="modal" hidden>
  <div class="dlg">
    <h2>Live data proxy</h2>
    <p>Your Cloudflare Worker URL. Your LTA key stays inside the Worker.</p>
    <input id="apiInput" class="field" type="url" placeholder="https://…workers.dev" inputmode="url">
    <div id="testResult"></div>
    <div class="row">
      <button class="btn" id="testBtn">Test</button>
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<div id="confirmRestart" class="modal" hidden>
  <div class="dlg">
    <h2>Restart everything?</h2>
    <p>This clears the current trip, route, alerts and connecting-bus panel. Your proxy setting is kept.</p>
    <div class="row">
      <button class="btn" id="restartNo">Cancel</button>
      <button class="btn red" id="restartYes">Restart</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="loading">Loading bus data…</div>

<script>
// ======================= CONFIG =======================
const DEFAULT_API = 'https://sg-bus-proxy.zanyzanzen.workers.dev';
const POLL_MS = 20000;          // live data refresh
const ALERT_STOPS = 2;          // first alight alert, stops before your stop
const DATA_BASES = [
  'https://cdn.jsdelivr.net/gh/cheeaun/sgbusdata@main/data/v1/',
  'https://raw.githubusercontent.com/cheeaun/sgbusdata/main/data/v1/'
];
const COLORS = {
  bus: '#e01b24', busRoof: '#ff5252', bus2: '#7f1d1d', bus2Roof: '#a33a3a',
  stop: '#0d2c6c', stopPassed: '#8b9bb4'
};
// ======================================================

// ==PURE-START==  (pure maths: route geometry, schedules, 3D shapes)
const LNG0 = 103.8, LAT0 = 1.35;
const KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KY = 110574;
function toXY(ll) { return [(ll[0] - LNG0) * KX, (ll[1] - LAT0) * KY]; }
function toLL(p) { return [p[0] / KX + LNG0, p[1] / KY + LAT0]; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// Google encoded polyline (precision 5, lat/lng) → [[lng, lat], ...]
function decodePolyline(str) {
  let i = 0, lat = 0, lng = 0; const out = [];
  while (i < str.length) {
    for (let k = 0; k < 2; k++) {
      let shift = 0, result = 0, b;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lng / 1e5, lat / 1e5]);
  }
  return out;
}

// Build a route object with cumulative distance ("chainage") and stop chainages
function makeRoute(lineLL, stopLL, checked) {
  const ends = stopLL.filter(Boolean);
  if (!checked && lineLL.length > 1 && ends.length > 1) {
    // Some dataset lines are stored opposite to the stop order: compare the ends & flip
    const d = (a, b) => { const p = toXY(a), q = toXY(b); return Math.hypot(p[0] - q[0], p[1] - q[1]); };
    const s0 = ends[0], s1 = ends[ends.length - 1], l0 = lineLL[0], l1 = lineLL[lineLL.length - 1];
    if (d(s0, l1) + d(s1, l0) + 200 < d(s0, l0) + d(s1, l1)) lineLL = lineLL.slice().reverse();
  }
  const xy = [], ll = [];
  for (const p of lineLL) {
    const q = toXY(p), l = xy[xy.length - 1];
    if (l && Math.hypot(q[0] - l[0], q[1] - l[1]) < 0.5) continue;
    xy.push(q); ll.push(p);
  }
  if (xy.length === 1) { xy.push([xy[0][0] + 1, xy[0][1]]); ll.push(toLL(xy[1])); }
  const cum = [0];
  for (let i = 1; i < xy.length; i++) cum.push(cum[i - 1] + Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]));
  const R = { xy, ll, cum, length: cum[cum.length - 1] };
  R.stopCh = placeStops(R, stopLL);
  return R;
}
// Place stops along the route in order. Every pass of the route near a stop is a
// candidate; dynamic programming picks the in-order combination closest overall.
function placeStops(R, stopLL) {
  const nSeg = R.xy.length - 1;
  const cands = stopLL.map(p => {
    if (!p) return null;
    const q = toXY(p), list = [];
    let run = null, best = null;
    for (let i = 0; i < nSeg; i++) {
      const r = projSeg(R, q, i);
      if (!best || r.d < best.d) best = r;
      if (r.d <= 80) { if (!run || r.d < run.d) run = r; }
      else if (run) { list.push(run); run = null; }
    }
    if (run) list.push(run);
    if (!list.length) list.push(best);
    return list;
  });
  // the first stop may always sit at the start of the line, the last at the end
  const endCand = (i, ch) => { if (cands[i]) { const e = xyAt(R, ch), q = toXY(stopLL[i]); cands[i].push({ ch, d: Math.hypot(q[0] - e[0], q[1] - e[1]) }); } };
  if (stopLL.length) { endCand(0, 0); endCand(stopLL.length - 1, R.length); }
  const n = stopLL.length, cost = [], back = [];
  let prevList = [{ ch: 0, d: 0 }], prevCost = [0];
  for (let i = 0; i < n; i++) {
    const list = cands[i] || prevList.map(c => ({ ch: c.ch, d: 0 }));
    const ci = [], bi = [];
    list.forEach((c, k) => {
      let bc = Infinity, bj = 0;
      prevList.forEach((pc, j) => {
        const pen = c.ch + 5 >= pc.ch ? 0 : 5000;              // must not go backwards
        const v = prevCost[j] + pen;
        if (v < bc) { bc = v; bj = j; }
      });
      ci.push(bc + c.d); bi.push(bj);
    });
    cost.push(ci); back.push(bi); cands[i] = list;
    prevList = list; prevCost = ci;
  }
  const out = new Array(n);
  let k = prevCost.indexOf(Math.min(...prevCost));
  for (let i = n - 1; i >= 0; i--) { out[i] = cands[i][k].ch; k = back[i][k]; }
  for (let i = 1; i < n; i++) if (out[i] < out[i - 1]) out[i] = out[i - 1];
  return out;
}
function projSeg(R, p, i) {
  const a = R.xy[i], b = R.xy[i + 1];
  const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
  let t = L2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2 : 0;
  t = clamp(t, 0, 1);
  const x = a[0] + t * dx, y = a[1] + t * dy;
  return { seg: i, ch: R.cum[i] + t * Math.sqrt(L2), d: Math.hypot(p[0] - x, p[1] - y) };
}
function segIndexAt(R, ch) {
  let lo = 0, hi = R.xy.length - 2;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (R.cum[mid] <= ch) lo = mid; else hi = mid - 1; }
  return lo;
}
// Nearest point on route between two chainages
function projectRange(R, p, ch0 = 0, ch1 = Infinity) {
  const i0 = segIndexAt(R, clamp(ch0, 0, R.length)), i1 = segIndexAt(R, clamp(ch1, 0, R.length));
  let best = null;
  for (let i = i0; i <= i1; i++) { const r = projSeg(R, p, i); if (!best || r.d < best.d) best = r; }
  return best;
}
function xyAt(R, ch) {
  ch = clamp(ch, 0, R.length);
  const i = segIndexAt(R, ch), a = R.xy[i], b = R.xy[i + 1];
  const L = R.cum[i + 1] - R.cum[i], t = L ? (ch - R.cum[i]) / L : 0;
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
// Heading in radians, 0 = north, clockwise
function headingAt(R, ch, span = 10) {
  const a = xyAt(R, ch - span), b = xyAt(R, ch + span);
  return Math.atan2(b[0] - a[0], b[1] - a[1]);
}

// Bus timetable from LTA estimates: arrive at each stop at its ETA, dwell, depart.
// anchors: [{ch, t}] from LTA; stopCh: all stop chainages on the route (sorted)
function buildSchedule(ch0, t0, anchors, stopCh) {
  const pts = [{ ch: ch0, t: t0 }];
  for (const a of anchors.slice().sort((x, y) => x.ch - y.ch)) {
    const last = pts[pts.length - 1];
    if (a.ch <= last.ch + 5) continue;
    const minT = last.t + (a.ch - last.ch) / 16 * 1000;      // cap at ~58 km/h
    pts.push({ ch: a.ch, t: Math.max(a.t, minT) });
  }
  const nodes = [{ ch: ch0, arr: t0 }];
  if (pts.length > 1) {
    const end = pts[pts.length - 1].ch;
    let j = 1;
    for (const s of stopCh) {
      if (s <= ch0 + 5 || s > end + 0.1) continue;
      if (s - nodes[nodes.length - 1].ch < 1) continue;       // duplicate stop position
      while (j < pts.length - 1 && pts[j].ch < s - 0.1) j++;
      const A = pts[j - 1], B = pts[j];
      const f = B.ch > A.ch ? clamp((s - A.ch) / (B.ch - A.ch), 0, 1) : 1;
      nodes.push({ ch: s, arr: A.t + f * (B.t - A.t) });
    }
  }
  for (let k = 0; k < nodes.length; k++) {
    const n = nodes[k], nx = nodes[k + 1];
    if (k === 0) n.dep = n.arr;
    else if (!nx) n.dep = Infinity;                            // hold at last known stop
    else n.dep = n.arr + Math.min(10000, 0.25 * (nx.arr - n.arr));
  }
  return nodes;
}
function chAt(nodes, t) {
  if (!nodes || !nodes.length) return 0;
  if (t <= nodes[0].arr) return nodes[0].ch;
  for (let k = nodes.length - 1; k >= 0; k--) {
    const n = nodes[k];
    if (t >= n.arr) {
      if (t <= n.dep) return n.ch;
      const nx = nodes[k + 1];
      if (!nx) return n.ch;
      return n.ch + (nx.ch - n.ch) * Math.min(1, (t - n.dep) / Math.max(1, nx.arr - n.dep));
    }
  }
  return nodes[0].ch;
}
// Smooth towards target; never creep backwards for small corrections
function smoothCh(disp, target, k) {
  if (target < disp && disp - target < 60) return disp;
  return disp + (target - disp) * k;
}

function polyFeature(ringXY, base, top, color) {
  const ring = ringXY.map(toLL); ring.push(ring[0]);
  return { type: 'Feature', properties: { b: base, h: top, c: color }, geometry: { type: 'Polygon', coordinates: [ring] } };
}
// Block-style 3D bus made of stacked boxes, front of bus at chainage ch
function busParts(R, ch, o) {

    if (best) { used.add(best); v.id = best.id; v.disp = best.disp; } else { v.id = ++state.vid; v.disp = v.ch0; }

// ======================= animation loop =======================
let lastFrame = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (document.hidden || ts - lastFrame < 50) return;     // ~20 fps
  const dt = Math.min(0.5, (ts - lastFrame) / 1000); lastFrame = ts;
  const R = state.R; if (!R || !map.getSource('buses')) return;
  const now = Date.now(), k = 1 - Math.exp(-dt / 0.8);
  const feats = [], pts = [];
  for (const v of state.vehicles) {
    v.disp = clamp(smoothCh(v.disp, chAt(v.nodes, now), k), 0, R.length);
    if (v.role === 'hidden' || state.mode === 'onboard') continue;
    const second = v.role === 'second';
    feats.push(...busParts(R, v.disp, { color: second ? COLORS.bus2 : COLORS.bus, roof: second ? COLORS.bus2Roof : COLORS.busRoof, dd: v.type === 'DD', bendy: v.type === 'BD' }));
    pts.push({ type: 'Feature', geometry: { type: 'Point', coordinates: toLL(xyAt(R, v.disp - 5)) }, properties: { label: R.no, color: second ? COLORS.bus2 : COLORS.bus } });
  }
  if (state.mode === 'onboard' && state.trip) {
    const T = state.trip;
    updateOwnBus(now, k);
    const mv = state.vehicles.find(v => v.id === T.myVid);
    feats.push(...busParts(R, T.disp, { color: COLORS.bus, roof: COLORS.busRoof, dd: mv && mv.type === 'DD', bendy: mv && mv.type === 'BD' }));
    pts.push({ type: 'Feature', geometry: { type: 'Point', coordinates: toLL(xyAt(R, T.disp - 5)) }, properties: { label: R.no + ' · You', color: COLORS.bus, mine: true } });
    if (T.follow) followCam(now);
    tripProgress();
    if (state.mode !== 'onboard' || !state.R) return;   // trip just ended
  }
  map.getSource('buses').setData({ type: 'FeatureCollection', features: feats });
  map.getSource('bus-pts').setData({ type: 'FeatureCollection', features: pts });
}

  enterMode('setup', '🚌 ' + no + ' · choosing direction');

  renderRoute(Rs[0], { fit: true });

  setPanel(panelHead('Which direction?', resetAll, no),
    ...Rs.map((R, d) => h('button', { class: 'dirbtn', onclick: () => chooseDirection(d) },
      h('b', null, '→ ' + R.dest), h('div', { class: 'sub', style: 'margin:2px 0 0' }, 'from ' + stopName(R.codes[0]) + ' · ' + R.codes.length + ' stops'))),

function setupOnFix(ll, t) {
  const S = state.setup; if (!S || S.sim || S.Rs.length < 2) return;
  S.fixes.push({ p: toXY(ll), t }); S.fixes = S.fixes.filter(f => t - f.t < 40000);
  const lastF = S.fixes[S.fixes.length - 1];
  const pr = S.Rs.map(R => projectRange(R, lastF.p));
  const status = $('detectStatus');
  const say = txt => { if (status) status.textContent = txt; };
  const minD = Math.min(pr[0].d, pr[1].d);
  if (minD > 120) return say(`You're ${fmtDist(minD)} from route ${S.no}. Pick your direction below.`);
  if (pr[0].d < 70 && pr[1].d > 150) return chooseDirection(0);
  if (pr[1].d < 70 && pr[0].d > 150) return chooseDirection(1);
  const first = S.fixes[0];
  if (Math.hypot(lastF.p[0] - first.p[0], lastF.p[1] - first.p[1]) >= 30) {
    const delta = S.Rs.map(R => projectRange(R, lastF.p).ch - projectRange(R, first.p).ch);
    const ok = [0, 1].filter(d => delta[d] > 15 && pr[d].d < 80);

// ======================= ON BOARD =======================

  }

          h('div', { class: 'kpi' }, tripUI.stops, h('span', null, 'stops left')),
          h('div', { class: 'kpi' }, tripUI.dist, h('span', null, 'distance')),
          h('div', { class: 'kpi' }, tripUI.eta, h('span', null, 'to your stop')))]
      : h('div', { class: 'note' }, 'Choose your alighting stop to get alerts.'),
    h('div', { class: 'row' },
      h('button', { class: 'pill primary', onclick: () => openAlightPicker(false) }, T.alightIdx != null ? 'Change stop' : 'Choose alighting stop'),
      simBtn,
      h('button', { class: 'pill', onclick: () => confirmRestart() }, 'End trip')),
    tripUI.src);
  updateTripPanel(true);
}
let lastPanelUpdate = 0;
function updateTripPanel(force) {
  const T = state.trip; if (!T || !tripUI || !document.body.contains(tripUI.next)) return;
  const now = Date.now(); if (!force && now - lastPanelUpdate < 1000) return; lastPanelUpdate = now;
  const R = T.R, nx = nextStopIdx(R, T.disp);
  const atIdx = R.stopCh.findIndex(c => Math.abs(c - T.disp) <= 20);
  tripUI.next.textContent = atIdx >= 0 ? 'At ' + stopName(R.codes[atIdx]) : (nx >= 0 ? stopName(R.codes[nx]) : 'End of route');
  if (T.alightIdx != null) {
    const left = stopsLeft(T), dist = Math.max(0, R.stopCh[T.alightIdx] - T.disp);
    tripUI.alight.textContent = '🏁 Alight at ' + stopName(R.codes[T.alightIdx]) + ' (#' + (T.alightIdx + 1) + ')';
    tripUI.stops.textContent = left;
    tripUI.dist.textContent = fmtDist(dist);
    let mins;
    if (T.ltaEta && !T.sim) mins = minsUntil(T.ltaEta);
    else mins = Math.round(dist / Math.max(T.speed || 0, 5) / 60);
    tripUI.eta.textContent = mins == null ? '–' : (mins <= 0 ? '<1 min' : '≈' + mins + ' min');
  }
  tripUI.src.textContent = T.sim ? '🧪 Simulated ride' : (T.gpsFresh ? '📡 Position from your GPS' : (T.myVid ? '🕒 GPS weak – using LTA estimate' : '⏳ Waiting for GPS…'));
}
function tripProgress() {
  const T = state.trip; if (!T) return;
  updateStops(false);
  updateTripPanel(false);
  if (T.alightIdx == null) return;
  const R = T.R, left = stopsLeft(T);
  const ahead = R.stopCh.findIndex(c => c > T.disp + 20);
  const name = stopName(R.codes[T.alightIdx]);
  if (left <= ALERT_STOPS && left > 1 && !T.alerts.first) {
    T.alerts.first = true;
    showAlert(left + ' stops to go', 'Next: ' + stopName(R.codes[ahead]) + ', then your stop: ' + name + '.');
    buzz([300, 150, 300]); beep(2);
  }
  if (left === 1 && !T.alerts.next) {
    T.alerts.first = T.alerts.next = true;
    showAlert('Your stop is next!', 'Press the bell now – alight at ' + name + '.', true);
    buzz([600, 200, 600, 200, 600]); beep(4);
  }
  const ac = R.stopCh[T.alightIdx];
  const dwelling = T.sim && T.simState && Date.now() < T.simState.dwellUntil;
  const busLL = toLL(xyAt(R, T.disp));
  const nearStop = distM(busLL, stopLL(R.codes[T.alightIdx])) < 30;      // safety net for data gaps
  if ((T.disp >= ac - 20 && (T.speed < 1.5 || T.disp > ac + 15 || dwelling)) || (nearStop && (T.speed < 1.5 || dwelling))) onArrived();
}

// Simulation: drives a fake GPS along the route, dwelling at every stop
function startSim() {
  const T = state.trip;
  T.simState = { ch: T.fixCh, dwellUntil: Date.now() + 3000, mult: 4, last: Date.now() };
  clearInterval(T.simTimer);
  T.simTimer = setInterval(() => {
    if (state.trip !== T) return;
    const S = T.simState, now = Date.now(), dt = (now - S.last) / 1000; S.last = now;
    if (now >= S.dwellUntil) {
      const v = 11 * S.mult; let ch = S.ch + v * dt;
      const ns = T.R.stopCh.findIndex(c => c > S.ch + 1);
      if (ns >= 0 && ch >= T.R.stopCh[ns]) { ch = T.R.stopCh[ns]; S.dwellUntil = now + 12000 / S.mult; }
      S.ch = Math.min(ch, T.R.length);
    }
    tripOnFix(toLL(xyAt(T.R, S.ch)), 5, now, true);
  }, 500);
}

// ======================= ARRIVED → CONNECTING BUSES =======================
function onArrived() {
  const T = state.trip; if (!T) return;
  const code = T.R.codes[T.alightIdx], fromNo = T.no;
  buzz([200, 100, 200]); beep(2);
  $('alertBox').hidden = true;
  enterMode('arrived', '📍 ' + stopName(code));
  setPoll(null); clearRoute();
  const here = stopLL(code);
  const nearby = Object.entries(state.stops)
    .map(([c, s]) => ({ code: c, d: distM(here, [s[0], s[1]]) }))
    .filter(x => x.d <= 150).sort((a, b) => a.d - b.d).slice(0, 10);
  state.arrived = { code, fromNo, nearby };
  map.getSource('sel-stop').setData({ type: 'Feature', geometry: { type: 'Point', coordinates: here }, properties: {} });
  map.easeTo({ center: here, zoom: 17, pitch: 50, duration: 900 });
  renderConnect(null);
  setPoll(pollConnect, 30000);
}
async function pollConnect() {
  const A = state.arrived; if (!A) return;
  const token = state.pollToken;
  try {
    const data = await api('/multi-arrival?stops=' + A.nearby.map(x => x.code).join(','));
    if (token !== state.pollToken || state.arrived !== A) return;
    renderConnect(data);
  } catch (e) { if (state.arrived === A) renderConnect({ error: e.message }); }
}
function renderConnect(data) {
  const A = state.arrived; if (!A) return;
  const groups = [];
  for (const { code, d } of A.nearby) {
    const live = data && data.stops ? data.stops[code] || [] : [];
    const services = (state.stopServices[code] || []).filter(no => boardableDir(no, code) >= 0);
    if (!services.length) continue;
    const rows = services.map(no => {
      const sv = live.find(x => x.ServiceNo === no);
      const buses = sv ? sv.buses : [];
      const first = buses[0] ? Date.parse(buses[0].eta) : Infinity;
      return { no, buses, first };
    }).sort((a, b) => a.first - b.first || naturalSort(a.no, b.no));
    groups.push(h('div', { class: 'grp' }, stopName(code) + ' ', h('small', null, code + (d > 5 ? ' · ' + fmtDist(d) + ' away' : ' · this stop'))));
    for (const r of rows) {
      const b0 = r.buses[0] || {};
      const destCode = b0.dest || (() => { const R = getRoute(r.no, boardableDir(r.no, code)); return R.codes[R.codes.length - 1]; })();
      groups.push(h('div', { class: 'arr tap', onclick: () => startWaiting(r.no, code, A) },
        h('span', { class: 'chip' }, r.no),
        h('div', { class: 'info' }, h('div', { class: 'dest' }, '→ ' + stopName(destCode)),
          h('div', { class: 'times' }, data ? timePills(r.buses) : h('span', { class: 'meta' }, 'Loading…'))),
        h('span', { class: 'meta' }, '›')));
    }
  }
  setPanel(
    panelHead('You have arrived', null, A.fromNo),
    h('div', { class: 'sub' }, stopName(A.code) + ' (' + A.code + ')'),
    h('div', { class: 'big', style: 'font-size:18px' }, 'Connecting bus? Pick the service you are taking next.'),
    data && data.error ? h('div', { class: 'note' }, '⚠ ' + data.error) : null,
    groups.length ? groups : h('div', { class: 'note' }, 'No services found nearby.'),
    legend(),
    h('div', { class: 'row' }, h('button', { class: 'pill', onclick: resetAll }, 'No thanks – finish'),
      data ? h('span', { class: 'meta' }, 'Updated ' + hhmm()) : null));
}

// ======================= WAITING FOR A BUS =======================
function startWaiting(no, code, fromArrived) {
  const dir = boardableDir(no, code);
  if (dir < 0) return toast('Service ' + no + ' does not depart from this stop');
  const R = getRoute(no, dir);
  const idx = R.codes.findIndex((c, i) => c === code && i < R.codes.length - 1);
  enterMode('waiting', '⏱ ' + no + ' at ' + stopName(code));
  state.wait = { no, R, code, idx, alightIdx: null, fitted: false, next: null, after: null, fromArrived, lastCh: null, moveCount: 0 };
  renderRoute(R);
  const ll = stopLL(code);
  map.easeTo({ center: ll, zoom: 16, pitch: 55, duration: 800 });
  renderWaitPanel();
  setPoll(pollWaiting);
}
let waitUI = null;
function renderWaitPanel() {
  const W = state.wait; if (!W) return;
  waitUI = { count: h('div', { class: 'big' }, 'Checking…'), info: h('div', { class: 'sub' }), then: h('div', { class: 'sub' }), upd: h('div', { class: 'status' }) };
  setPanel(
    panelHead('Bus ' + W.no + ' → ' + W.R.dest, null, W.no),
    h('div', { class: 'sub' }, 'Waiting at ' + stopName(W.code) + ' (#' + (W.idx + 1) + ')'),
    waitUI.count, waitUI.info, waitUI.then,
    h('div', { class: 'sub' }, W.alightIdx != null ? '🏁 Alighting at ' + stopName(W.R.codes[W.alightIdx]) : 'Alighting stop not chosen yet'),
    h('div', { class: 'row' },
      h('button', { class: 'pill', onclick: () => openAlightPicker(true) }, W.alightIdx != null ? 'Change stop' : 'Choose alighting stop'),
      h('button', { class: 'pill red', onclick: () => boardNow() }, "I'm on board ▶")),
    h('div', { class: 'row' },
      W.fromArrived ? h('button', { class: 'pill', onclick: backToList }, '‹ Back to list') : null,
      h('label', { class: 'check', style: 'margin:0' }, (() => { const c = h('input', { type: 'checkbox' }); c.checked = state.simPref; c.onchange = () => state.simPref = c.checked; return c; })(), 'Simulate ride')),
    waitUI.upd, legend());
  updateWaitPanel();
}
function updateWaitPanel() {
  const W = state.wait; if (!W || !waitUI) return;
  const n = W.next, a = W.after;
  if (!W.loaded) return;
  if (!n) { waitUI.count.textContent = 'No live arrival right now'; waitUI.info.textContent = 'The service may not be operating.'; waitUI.then.textContent = ''; }
  else {
    const m = minsUntil(Date.parse(n.eta));
    waitUI.count.textContent = m <= 0 ? 'Bus ' + W.no + ' arriving now' : 'Next bus in ' + m + ' min';
    waitUI.info.textContent = [LOAD_TXT[n.load], TYPE_TXT[n.type], n.feature === 'WAB' ? '♿ Wheelchair accessible' : '', n.lat ? '' : '(position not available)'].filter(Boolean).join(' · ');
    waitUI.then.textContent = a ? 'Then: ' + fmtMins(minsUntil(Date.parse(a.eta))) + ' (dark red bus) · ' + (LOAD_TXT[a.load] || '') : '';
  }
  waitUI.upd.textContent = 'Updated ' + hhmm();
}
async function pollWaiting() {
  const W = state.wait; if (!W) return;
  const R = W.R, token = state.pollToken, idxs = [];
  for (let i = Math.max(0, W.idx - 15); i <= W.idx; i++) idxs.push(i);
  for (let i = W.idx - 19; i > 0 && idxs.length < 22; i -= 4) idxs.push(i);
  try {
    const data = await fetchServiceData(R, idxs);
    if (token !== state.pollToken || state.wait !== W) return;
    const now = Date.now();
    mergeVehicles(vehiclesFrom(R, data, now));
    const atS = ((data.stops || {})[W.code] || []).filter(o => o.eta).sort((x, y) => Date.parse(x.eta) - Date.parse(y.eta));
    W.next = atS[0] || null; W.after = atS[1] || null; W.loaded = true;
    const keyOf = o => o && o.lat ? o.lat.toFixed(5) + ',' + o.lng.toFixed(5) : null;
    const k1 = keyOf(W.next), k2 = keyOf(W.after);
    for (const v of state.vehicles) v.role = v.key === k1 ? 'main' : v.key === k2 ? 'second' : 'hidden';
    updateWaitPanel();
    const mv = state.vehicles.find(v => v.role === 'main');
    if (mv && !W.fitted && !state.userMoved) {
      W.fitted = true;
      const b = new maplibregl.LngLatBounds(); b.extend(stopLL(W.code)); b.extend(toLL(xyAt(R, mv.disp)));
      map.fitBounds(b, { padding: { top: 140, bottom: $('panel').offsetHeight + 40, left: 60, right: 60 }, maxZoom: 16.5, duration: 900 });
    }
  } catch (e) { if (waitUI) waitUI.upd.textContent = '⚠ ' + e.message; }
}
// Auto-switch to on-board once your GPS moves along the route past the boarding stop
function waitOnFix(ll, acc, t) {
  const W = state.wait; if (!W || acc > 60) return;
  const R = W.R, chS = R.stopCh[W.idx];
  const r = projectRange(R, toXY(ll), chS - 100, chS + 1500);
  if (!r || r.d > 50) { W.moveCount = 0; return; }
  if (W.lastCh != null && r.ch > W.lastCh + 3 && r.ch > chS + 60) W.moveCount++; else if (r.ch <= chS + 60) W.moveCount = 0;
  W.lastCh = r.ch;
  if (W.moveCount >= 2) { toast('You are on board – tracking bus ' + W.no); boardNow(false); }
}
function boardNow(sim = state.simPref) {
  const W = state.wait; if (!W) return;
  state.wait = null;
  startTrip(W.no, W.R.dir, { sim, boardIdx: W.idx, alightIdx: W.alightIdx });
}
function backToList() {
  const W = state.wait; if (!W || !W.fromArrived) return;
  const A = W.fromArrived;
  state.wait = null; setPoll(null); clearRoute();
  enterMode('arrived', '📍 ' + stopName(A.code));
  state.arrived = A;
  map.getSource('sel-stop').setData({ type: 'Feature', geometry: { type: 'Point', coordinates: stopLL(A.code) }, properties: {} });
  map.easeTo({ center: stopLL(A.code), zoom: 17, duration: 700 });
  renderConnect(null);
  setPoll(pollConnect, 30000);
}

// ======================= RESTART / SETTINGS =======================
function confirmRestart() { $('confirmRestart').hidden = false; }
$('restartBtn').onclick = confirmRestart;
$('restartNo').onclick = () => $('confirmRestart').hidden = true;
$('restartYes').onclick = () => { $('confirmRestart').hidden = true; resetAll(); };
function resetAll() {
  setPoll(null);
  stopTrip();
  state.setup = state.wait = state.arrived = null;
  state.userMoved = false;
  enterMode('browse');
  clearRoute(); hidePanel();
  $('alertBox').hidden = true; $('routeBar').hidden = true; $('q').value = '';
  history.replaceState(null, '', location.pathname);
  map.easeTo({ center: state.user ? state.user.ll : [103.8198, 1.3521], zoom: state.user ? 15.5 : 11, pitch: 50, bearing: -15, duration: 900 });
  toast('Restarted');
}

$('settingsBtn').onclick = () => { $('apiInput').value = API; $('testResult').textContent = ''; $('settings').hidden = false; };
$('cancelBtn').onclick = () => $('settings').hidden = true;
$('saveBtn').onclick = () => {
  API = $('apiInput').value.trim().replace(/\/+$/, '');
  store.set('busApi', API);
  $('settings').hidden = true;
  toast(API ? 'Proxy saved' : 'Proxy cleared');
  if (state.pollFn) state.pollFn();
};
$('testBtn').onclick = async () => {
  const url = $('apiInput').value.trim().replace(/\/+$/, ''), out = $('testResult');
  if (!url) { out.textContent = 'Enter a URL first.'; return; }
  out.style.color = ''; out.textContent = 'Testing…';
  try {
    const r = await fetch(url + '/multi-arrival?stops=83139');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    out.style.color = '#0a8a3a';
    out.textContent = '✓ Working (v2) – ' + ((d.stops || {})['83139'] || []).length + ' services at test stop 83139';
  } catch (e) {
    out.style.color = '#c62828';
    out.textContent = '✗ ' + e.message + ' – is the Worker updated to v2?';
  }
};
